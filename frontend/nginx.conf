# Bingo Math — nginx của container frontend (file này nằm trong khối http, conf.d/default.conf)

# DNS nội bộ của Docker: nginx không chết khi khởi động lúc chưa resolve được "backend",
# và tự resolve lại khi container backend được tạo lại (đổi IP).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 64k;
  server_tokens off;

  # Dùng biến để nginx resolve lúc chạy (không có URI phía sau => giữ nguyên URI gốc)
  set $backend http://backend:8000;

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /avatars/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # File có hash trong tên: cache 1 năm
  location /assets/ {
    # Không dùng "expires 1y" vì nó sinh thêm một dòng Cache-Control thứ hai
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: index.html và file tĩnh ở gốc không được cache cứng
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
